name: build
on:
  push:
  workflow_dispatch:
jobs:
  so:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: deps
        run: |
          git clone --depth 1 --branch v1.90.4 https://github.com/ocornut/imgui third_party/imgui
          git clone --depth 1 https://github.com/jmpews/Dobby third_party/dobby
      - name: configure
        run: cmake -B out -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build out -j4
      - uses: actions/upload-artifact@v4
        with:
          name: libgillamod
          path: out/libgillamod.so
